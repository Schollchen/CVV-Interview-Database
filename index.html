<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Chris Van Vliet Interview Database</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700&family=Big+Shoulders+Display:wght@700;800&display=swap">
<style>
  :root {
    --mat: #EEF0F3;
    --surface: #FFFFFF;
    --ink: #111C36;
    --muted: #55627D;
    --red: #C9382B;
    --blue: #2851C4;
    --line: #D5DAE3;
    --bar: #B8C0CF;
    color-scheme: light dark;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --mat: #121A30;
      --surface: #1A2440;
      --ink: #EEF1F7;
      --muted: #A3AEC5;
      --red: #F0594A;
      --blue: #8FB0FF;
      --line: #2C3858;
      --bar: #3B4B75;
    }
  }
  :root[data-theme="light"] { color-scheme: light; }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --mat: #121A30;
    --surface: #1A2440;
    --ink: #EEF1F7;
    --muted: #A3AEC5;
    --red: #F0594A;
    --blue: #8FB0FF;
    --line: #2C3858;
    --bar: #3B4B75;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  *, *::before, *::after { box-sizing: inherit; }
  body {
    margin: 0;
    background: var(--mat);
    color: var(--ink);
    font: 400 1rem/1.5 "Archivo", system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  :focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }

  .wrap { max-width: 60rem; margin: 0 auto; padding: 2.5rem 1.25rem 3.5rem; }

  h1 {
    margin: 0;
    font: 800 clamp(2.9rem, 10.5vw, 6.5rem)/0.92 "Big Shoulders Display", "Oswald", "Arial Narrow", Impact, sans-serif;
    letter-spacing: -0.005em;
    text-wrap: balance;
  }
  .lede { margin: 1rem 0 0; max-width: 42ch; color: var(--muted); font-size: 1.1rem; }

  /* Suche */
  .search { position: relative; margin-top: 2rem; }
  .search svg { position: absolute; left: 1rem; top: 50%; width: 1.25rem; height: 1.25rem; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
  .search input {
    width: 100%;
    padding: 0.9rem 1rem 0.9rem 3rem;
    font: 600 1.15rem/1.3 "Archivo", system-ui, sans-serif;
    color: var(--ink);
    background: var(--surface);
    border: 2px solid var(--line);
    border-radius: 4px;
  }
  .search input::placeholder { color: var(--muted); font-weight: 400; }
  .search input:focus-visible { border-color: var(--blue); outline-offset: 0; }

  /* Jahresleiste */
  .caption { margin: 1.75rem 0 0.5rem; color: var(--muted); font-size: 0.92rem; }
  .years {
    display: grid;
    grid-template-columns: repeat(var(--n, 14), 1fr);
    gap: 0.3rem;
    height: 9.5rem;
    padding: 0.75rem 0.75rem 0.5rem;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 4px;
  }
  .year {
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    align-items: center;
    gap: 0.2rem;
    height: 100%;
    min-width: 0;
    padding: 0;
    font: inherit;
    color: inherit;
    background: none;
    border: 0;
    cursor: pointer;
  }
  .year .count { font-size: 0.7rem; line-height: 1; color: var(--muted); font-variant-numeric: tabular-nums; }
  .year .bar {
    width: 100%;
    max-width: 2.4rem;
    height: var(--h, 0%);
    min-height: 2px;
    background: var(--bar);
    border-radius: 2px 2px 0 0;
    transition: height 0.3s ease;
  }
  .year .label { margin-top: 0.2rem; font-size: 0.78rem; line-height: 1; font-weight: 600; color: var(--muted); }
  .year .y-short { display: none; }
  .year:hover .bar { background: var(--muted); }
  .year[aria-pressed="true"] .bar { background: var(--red); }
  .year[aria-pressed="true"] .label { color: var(--red); }

  /* Monate */
  .chips { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-top: 1rem; }
  .chip {
    padding: 0.4rem 0.8rem;
    font: 600 0.92rem/1.2 "Archivo", system-ui, sans-serif;
    color: var(--ink);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 3px;
    cursor: pointer;
  }
  .chip:hover { border-color: var(--muted); }
  .chip[aria-pressed="true"] { color: var(--mat); background: var(--ink); border-color: var(--ink); }

  /* Ergebnisleiste */
  .bar-row {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    justify-content: space-between;
    gap: 0.5rem 1.25rem;
    margin-top: 2rem;
    padding-bottom: 0.6rem;
    border-bottom: 3px solid var(--ink);
  }
  .count-text { margin: 0; font-weight: 700; font-size: 1.05rem; }
  .actions { display: flex; gap: 1.25rem; }
  .link-btn {
    padding: 0;
    font: 600 0.95rem/1.3 "Archivo", system-ui, sans-serif;
    color: var(--blue);
    background: none;
    border: 0;
    cursor: pointer;
    text-decoration: underline;
    text-underline-offset: 3px;
  }
  .link-btn:hover { color: var(--red); }
  .sort-select {
    padding: 0 0.1rem;
    font: 600 0.95rem/1.3 "Archivo", system-ui, sans-serif;
    color: var(--blue);
    background: transparent;
    border: 0;
    cursor: pointer;
  }
  .sort-select:hover { color: var(--red); }
  .sort-select option { color: var(--ink); background: var(--surface); }
  .note { margin: 0.6rem 0 0; color: var(--muted); font-size: 0.88rem; }

  /* Liste */
  .list { margin: 0; padding: 0; list-style: none; }
  .row {
    display: grid;
    grid-template-columns: 4.5rem minmax(0, 1fr) auto;
    column-gap: 1rem;
    align-items: baseline;
    padding: 1.05rem 0.5rem;
    border-bottom: 1px solid var(--line);
  }
  .row:hover { background: var(--surface); }
  .no {
    font: 700 1.5rem/1 "Big Shoulders Display", "Oswald", "Arial Narrow", Impact, sans-serif;
    color: var(--red);
    font-variant-numeric: tabular-nums;
  }
  .guest {
    margin: 0;
    font: 700 1.75rem/1.05 "Big Shoulders Display", "Oswald", "Arial Narrow", Impact, sans-serif;
    overflow-wrap: anywhere;
  }
  .title {
    display: inline-block;
    margin-top: 0.3rem;
    color: var(--blue);
    text-decoration: none;
    font-size: 0.95rem;
    max-width: 70ch;
  }
  .title:hover, .title:focus-visible { text-decoration: underline; text-underline-offset: 3px; }
  .date { color: var(--muted); font-size: 0.9rem; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .date.missing { font-style: italic; }
  .meta { display: flex; flex-direction: column; align-items: flex-end; gap: 0.15rem; }
  .len { font-size: 0.9rem; font-weight: 700; color: var(--ink); font-variant-numeric: tabular-nums; white-space: nowrap; }

  .appearances { display: flex; flex-wrap: wrap; gap: 0.35rem; margin-top: 0.4rem; }
  .appear {
    padding: 0.1rem 0.5rem;
    font: 600 0.78rem/1.5 "Archivo", system-ui, sans-serif;
    color: var(--muted);
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 3px;
    cursor: pointer;
  }
  .appear:hover { color: var(--red); border-color: var(--red); }
  .empty { padding: 2.5rem 0.5rem; }
  .empty p { margin: 0 0 0.75rem; max-width: 46ch; }
  .empty .head { font: 700 1.75rem/1.1 "Big Shoulders Display", "Oswald", "Arial Narrow", Impact, sans-serif; }

  @media (max-width: 640px) {
    .wrap { padding: 1.75rem 1rem 3rem; }
    .years { padding: 0.6rem 0.3rem 0.4rem; gap: 0.1rem; }
    .year .y-full { display: none; }
    .year .y-short { display: inline; }
    .year .label { font-size: 0.62rem; }
    .year .count { font-size: 0.58rem; }
    .row { grid-template-columns: 3.2rem minmax(0, 1fr); padding-inline: 0.25rem; }
    .no { font-size: 1.25rem; }
    .guest { font-size: 1.5rem; }
    .meta { grid-column: 2; margin-top: 0.25rem; flex-direction: row; flex-wrap: wrap; align-items: baseline; gap: 0.2rem 0.9rem; }
  }
  @media (max-width: 480px) {
    .year .count { display: none; }
    .year[aria-pressed="true"] .count { display: block; }
  }
  @media (prefers-reduced-motion: reduce) {
    .year .bar { transition: none; }
  }
</style>
</head>

<script>
(() => {
  const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const SHORT  = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const norm = s => s.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();

  const data = JSON.parse(document.getElementById('data').textContent).map(r => {
    let y = null, m = null, day = null;
    if (r.d) { const p = r.d.split('-').map(Number); y = p[0]; m = p[1] - 1; day = p[2]; }
    return { n: r.n, g: r.g, t: r.t, u: r.u, l: (typeof r.l === 'number' ? r.l : null), d: r.d, y, m, day, key: norm(r.g) };
  });

  const personKey = p => norm(p).replace(/[^a-z0-9]/g, '');
  data.sort((a, b) => a.n - b.n);
  data.forEach(r => {
    r.people = r.g.split('&').map(s => s.trim()).filter(Boolean);
    r.keys = r.people.map(personKey);
  });
  const totals = {};
  data.forEach(r => r.keys.forEach(k => { totals[k] = (totals[k] || 0) + 1; }));
  const seen = {};
  data.forEach(r => {
    r.ord = r.keys.map(k => { seen[k] = (seen[k] || 0) + 1; return seen[k]; });
  });

  const dated = data.filter(r => r.y !== null).map(r => r.y);
  const minY = Math.min(...dated), maxY = Math.max(...dated);
  const yearList = [];
  for (let y = minY; y <= maxY; y++) yearList.push(y);

  const state = { q: '', person: null, month: null, year: null, band: null, sort: 'new' };
  const $ = id => document.getElementById(id);

  $('total').textContent = data.length;
  $('range').textContent = minY + ' to ' + maxY;

  function matches(r, skip) {
    if (state.person) {
      if (!r.keys.includes(state.person)) return false;
    } else {
      const tokens = norm(state.q).split(/\s+/).filter(Boolean);
      if (!tokens.every(t => r.key.includes(t))) return false;
    }
    if (skip !== 'month' && state.month !== null && r.m !== state.month) return false;
    if (skip !== 'year' && state.year !== null && r.y !== state.year) return false;
    if (state.band !== null) {
      if (r.l === null) return false;
      const b = r.l < 30 ? 'short' : (r.l < 60 ? 'mid' : 'long');
      if (b !== state.band) return false;
    }
    return true;
  }

  // Monatsfilter aufbauen
  const monthBox = $('months');
  const monthBtns = [];
  function addChip(label, value, fullName) {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'chip';
    b.textContent = label;
    if (fullName) b.setAttribute('aria-label', fullName);
    b.addEventListener('click', () => {
      state.month = (value !== null && state.month === value) ? null : value;
      render();
    });
    monthBox.appendChild(b);
    monthBtns.push({ b, value });
  }
  addChip('All months', null);
  SHORT.forEach((s, i) => addChip(s, i, MONTHS[i]));

  // Längenfilter aufbauen
  const fmtLen = m => m < 60 ? m + ' min' : Math.floor(m / 60) + ' h' + (m % 60 ? ' ' + (m % 60) + ' min' : '');
  const BANDS = [[null, 'Any length'], ['short', 'Under 30 min'], ['mid', '30\u201359 min'], ['long', '60+ min']];
  const bandBox = $('lengths');
  if (!data.some(r => r.l !== null)) bandBox.style.display = 'none';
  const bandBtns = BANDS.map(([value, label]) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'chip';
    b.textContent = label;
    b.addEventListener('click', () => {
      state.band = (value !== null && state.band === value) ? null : value;
      render();
    });
    bandBox.appendChild(b);
    return { b, value };
  });

  // Jahresleiste aufbauen
  const yearBox = $('years');
  yearBox.style.setProperty('--n', yearList.length);
  const yearBtns = yearList.map(y => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'year';
    const c = document.createElement('span'); c.className = 'count';
    const bar = document.createElement('span'); bar.className = 'bar';
    const l = document.createElement('span'); l.className = 'label';
    const full = document.createElement('span'); full.className = 'y-full'; full.textContent = y;
    const short = document.createElement('span'); short.className = 'y-short'; short.textContent = String(y).slice(2);
    l.append(full, short);
    b.append(c, bar, l);
    b.addEventListener('click', () => { state.year = state.year === y ? null : y; render(); });
    yearBox.appendChild(b);
    return { y, b, c, bar };
  });
  const overallMax = Math.max(1, ...yearList.map(y => data.filter(r => r.y === y).length));

  function rowEl(r) {
    const li = document.createElement('li');
    li.className = 'row';

    const no = document.createElement('span');
    no.className = 'no';
    no.textContent = '#' + r.n;

    const main = document.createElement('div');
    const g = document.createElement('p');
    g.className = 'guest';
    g.textContent = r.g;
    main.appendChild(g);

    const multi = r.people.length > 1;
    const chips = [];
    r.people.forEach((name, i) => {
      const total = totals[r.keys[i]];
      if (total < 2) return;
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'appear';
      b.textContent = (multi ? name + ': appearance ' : 'Appearance ') + r.ord[i] + ' of ' + total;
      b.title = 'Show all ' + total + ' interviews with ' + name;
      b.addEventListener('click', () => {
        state.person = r.keys[i];
        state.q = name;
        state.month = null;
        state.year = null;
        $('q').value = name;
        render();
        $('count').scrollIntoView({ block: 'start' });
      });
      chips.push(b);
    });
    if (chips.length) {
      const wrap = document.createElement('div');
      wrap.className = 'appearances';
      chips.forEach(c => wrap.appendChild(c));
      main.appendChild(wrap);
    }

    if (r.t) {
      const a = document.createElement('a');
      a.className = 'title';
      a.textContent = r.t;
      a.href = r.u || ('https://www.youtube.com/results?search_query=' + encodeURIComponent('Chris Van Vliet ' + r.t));
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      main.appendChild(a);
    }

    const date = document.createElement(r.d ? 'time' : 'span');
    date.className = 'date';
    if (r.d) {
      date.dateTime = r.d;
      date.textContent = MONTHS[r.m] + ' ' + r.day + ', ' + r.y;
    } else {
      date.classList.add('missing');
      date.textContent = 'Date missing';
    }

    const meta = document.createElement('div');
    meta.className = 'meta';
    meta.appendChild(date);
    if (r.l !== null) {
      const len = document.createElement('span');
      len.className = 'len';
      len.textContent = fmtLen(r.l);
      meta.appendChild(len);
    }

    li.append(no, main, meta);
    return li;
  }

  function render() {
    const byLen = dir => (a, b) => {
      if (a.l === null && b.l === null) return b.n - a.n;
      if (a.l === null) return 1;
      if (b.l === null) return -1;
      return dir * (a.l - b.l) || (b.n - a.n);
    };
    const sorters = { new: (a, b) => b.n - a.n, old: (a, b) => a.n - b.n, long: byLen(-1), short: byLen(1) };
    const list = data.filter(r => matches(r)).sort(sorters[state.sort]);
    const filtered = state.q.trim() !== '' || state.month !== null || state.year !== null || state.band !== null;

    $('count').textContent = filtered ? list.length + ' of ' + data.length + ' interviews' : data.length + ' interviews';
    $('reset').hidden = !filtered;
    $('sort').value = state.sort;

    monthBtns.forEach(({ b, value }) => b.setAttribute('aria-pressed', String(state.month === value)));
    bandBtns.forEach(({ b, value }) => b.setAttribute('aria-pressed', String(state.band === value)));

    yearBtns.forEach(({ y, b, c, bar }) => {
      const n = data.filter(r => matches(r, 'year') && r.y === y).length;
      c.textContent = n;
      bar.style.setProperty('--h', (n / overallMax * 78) + '%');
      b.setAttribute('aria-pressed', String(state.year === y));
      b.setAttribute('aria-label', y + ': ' + n + (n === 1 ? ' interview' : ' interviews'));
    });

    const ul = $('list');
    ul.replaceChildren();
    if (list.length === 0) {
      const li = document.createElement('li');
      li.className = 'empty';
      const h = document.createElement('p'); h.className = 'head'; h.textContent = 'No interviews found';
      const p = document.createElement('p'); p.textContent = 'Check the spelling of the guest name or choose a different month, year or length.';
      li.append(h, p);
      ul.appendChild(li);
      return;
    }
    const frag = document.createDocumentFragment();
    list.forEach(r => frag.appendChild(rowEl(r)));
    ul.appendChild(frag);
  }

  $('q').addEventListener('input', e => { state.q = e.target.value; state.person = null; render(); });
  $('reset').addEventListener('click', () => {
    state.q = ''; state.person = null; state.month = null; state.year = null; state.band = null;
    $('q').value = '';
    render();
  });
  $('sort').addEventListener('change', e => { state.sort = e.target.value; render(); });

  render();
})();
</script>
</body>
</html>
